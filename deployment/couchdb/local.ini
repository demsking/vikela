; Documentation is available at https://docs.couchdb.org/en/stable/config

[couchdb]
single_node = true
uuid = 8d5b8f5220d654f6e09f6a8e42faba30

[vendor]
name = Vikela

[chttpd]
enable_cors = false
require_valid_user = true
authentication_handlers = {chttpd_auth, proxy_authentication_handler}, {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, default_authentication_handler}

; https://docs.couchdb.org/en/stable/config/auth.html#jwt_auth
[jwt_auth]
required_claims = exp  ; Enforce presence of expiration claim in JWT token

[jwt_keys]
hmac:_default = c3Ryb25nX2p3dF9zZWNyZXQ=

[cors]
origins = *
headers = accept, authorization, content-type, origin, referer
credentials = true
methods = GET, PUT, POST, HEAD, DELETE

[csp]
enable = false

[chttpd_auth]
proxy_use_secret = true
allow_persistent_cookies = true
hash_algorithms = sha256, sha

[chttpd_auth]
secret = couchdb_secret

