[tool.poetry]
name = "vikela"
version = "1.0.0dev2"
description = "Vikela sets up a robust authentication system to secure backend services using an authentication provider and various proxy middleware solutions such as Traefik, Nginx, and others"
keywords = ["vikela", "restfull", "api"]
authors = ["Sébastien Demanou <demsking@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://gitlab.com/demsking/vikela"
documentation = "https://gitlab.com/demsking/vikela/-/blob/main/README.md"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Localization",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
]

[tool.poetry.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Source" = "https://gitlab.com/demsking/vikela"
"Tracker" = "https://gitlab.com/demsking/vikela/-/issues"

[[tool.poetry.source]]
name = "test"
url = "https://test.pypi.org/simple/"
secondary = true

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.111.0"
httpx = "^0.27.0"
dataclasses-json = "^0.6.6"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
oremi-core = "^1.0.0b7"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
jsonschema = "^4.22.0"
pyotp = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
trio = "^0.25.1"
pytest-asyncio = "^0.23.7"
pylint = "^3.2.4"
python-lsp-server = "^1.11.0"

[tool.skjold]
sources = ["pyup", "gemnasium", "osv", "pypa"]
report_only = false # Exit with non-zero exit code on findings.

[tool.pytest.ini_options]
# Function starting with the following pattern are considered for test cases.
python_functions = "test_"
