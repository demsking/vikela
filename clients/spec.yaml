ull"}],"title":"Interests"},"bio":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Bio"},"profile_picture_url":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Profile Picture Url"},"social_links":{"anyOf":[{"type":"object"},{"type":"null"}],"title":"Social Links"}},"type":"object","required":["username","password","email","first_name","last_name","date_of_birth"],"title":"RegisterPayload"},"ServerInfo":{"properties":{"name":{"type":"string","title":"Name"},"version":{"type":"string","title":"Version"}},"type":"object","required":["name","version"],"title":"ServerInfo"},"UserData":{"properties":{"email":{"type":"string","title":"Email"},"first_name":{"type":"string","title":"First Name"},"last_name":{"type":"string","title":"Last Name"},"date_of_birth":{"type":"string","title":"Date Of Birth"},"gender":{"anyOf":[{"type":"string","enum":["male","female"]},{"type":"null"}],"title":"Gender"},"address":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address"},"phone_number":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Phone Number"},"interests":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Interests"},"bio":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Bio"},"profile_picture_url":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Profile Picture Url"},"social_links":{"anyOf":[{"type":"object"},{"type":"null"}],"title":"Social Links"}},"type":"object","required":["email","first_name","last_name","date_of_birth"],"title":"UserData"},"ValidationError":{"properties":{"loc":{"items":{"anyOf":[{"type":"string"},{"type":"integer"}]},"type":"array","title":"Location"},"msg":{"type":"string","title":"Message"},"type":{"type":"string","title":"Error Type"}},"type":"object","required":["loc","msg","type"],"title":"ValidationError"}},"securitySchemes":{"OAuth2PasswordBearer":{"type":"oauth2","flows":{"password":{"scopes":{},"tokenUrl":"/token"}}}}},"tags":[{"name":"Server Endpoints","description":"Endpoints to retrieve server information including name and version."},{"name":"Account Endpoints","description":"Endpoints related to user account management, including registration, account details, and updates."},{"name":"1FA Endpoints","description":"Endpoints related to One Time Passwords authentication."},{"name":"2FA Endpoints","description":"Endpoints related to two-factor authentication (2FA) setup and verification."},{"name":"Proxy Endpoints","description":"\n  Endpoints that serve as proxies for authentication and authorization, providing access token verification and user information retrieval. These endpoints manage user sessions and set custom headers based on authenticated user data.\n\n  <style>\n    .method {\n      font-size: 0.929em;\n      line-height: 20px;\n      color: rgb(255, 255, 255);\n      padding: 3px 10px;\n      text-transform: uppercase;\n      font-family: Montserrat, sans-serif;\n      margin: 0px;\n    }\n\n    .method.get {\n      background-color: rgb(47, 129, 50);\n    }\n\n    .method.post {\n      background-color: rgb(24, 111, 175);\n    }\n\n    .method.put {\n      background-color: rgb(149, 80, 124);\n    }\n\n    .method.delete {\n      background-color: rgb(204, 51, 51);\n    }\n\n    .method.patch {\n      background-color: rgb(191, 88, 29);\n    }\n  </style>\n\n  <div style=\"border-radius:4px;margin-bottom:3px\"><div style=\"cursor:default;background-color: rgb(17, 23, 26);padding:10px 20px 7px;width:100%\"><span type=\"get\" class=\"method get\">get</span><span class=\"sc-jXcxbT hVdkvA\" style=\"color:#fff\">/proxy/verify</span></div></div>\n\n  <div style=\"border-radius:4px;margin-bottom:3px\"><div style=\"cursor:default;background-color: rgb(17, 23, 26);padding:10px 20px 7px;width:100%\"><span type=\"post\" class=\"method post\">post</span><span class=\"sc-jXcxbT hVdkvA\" style=\"color:#fff\">/proxy/verify</span></div></div>\n\n  <div style=\"border-radius:4px;margin-bottom:3px\"><div style=\"cursor:default;background-color: rgb(17, 23, 26);padding:10px 20px 7px;width:100%\"><span type=\"put\" class=\"method put\">put</span><span class=\"sc-jXcxbT hVdkvA\" style=\"color:#fff\">/proxy/verify</span></div></div>\n\n  <div style=\"border-radius:4px;margin-bottom:3px\"><div style=\"cursor:default;background-color: rgb(17, 23, 26);padding:10px 20px 7px;width:100%\"><span type=\"delete\" class=\"method delete\">delete</span><span class=\"sc-jXcxbT hVdkvA\" style=\"color:#fff\">/proxy/verify</span></div></div>\n\n  <div style=\"border-radius:4px;margin-bottom:3px\"><div style=\"cursor:default;background-color: rgb(17, 23, 26);padding:10px 20px 7px;width:100%\"><span type=\"patch\" class=\"method patch\">patch</span><span class=\"sc-jXcxbT hVdkvA\" style=\"color:#fff\">/proxy/verify</span></div></div>\n\n  Verify user and set custom headers or redirect to login.\n\n  This endpoint verifies the user using an OAuth2 token or session cookie. If\n  the user is authenticated, it sets custom headers with user information. If\n  not, it redirects to the login URL.\n  "}]}