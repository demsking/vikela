---
services:
  couchdb:
    image: couchdb:3.3.3
    ports:
      - 25984:5984
    environment:
      COUCHDB_USER: $COUCHDB_USER
      COUCHDB_PASSWORD: $COUCHDB_PASSWORD
      COUCHDB_SECRET: $COUCHDB_SECRET
    volumes:
      - ./deployment/couchdb/local.ini:/opt/couchdb/etc/local.d/docker.ini

  server:
    build:
      context: .
      args:
        APP_NAME: vikela
        APP_VERSION: dev
    depends_on:
      - couchdb
    user: root
    environment:
      TZ: 'Africa/Douala'
      COUCHDB_URL: "http://couchdb:5984"
      JWT_SECRET_KEY: $JWT_SECRET_KEY
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: $JWT_ACCESS_TOKEN_EXPIRE_MINUTES
      COUCHDB_AUTH_USERNAME: $COUCHDB_AUTH_USERNAME
      COUCHDB_AUTH_TOKEN: $COUCHDB_AUTH_TOKEN
      LOG_LEVEL: 'debug'
    ports:
      - 26303:6303
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: poetry.lock
        - action: sync+restart
          path: DOCUMENTATION.md
          target: /opt/demanou/DOCUMENTATION.md
        - action: sync+restart
          path: vikela
          target: /opt/demanou/vikela
        - action: sync+restart
          path: vikela_core
          target: /opt/demanou/vikela_core
        - action: sync+restart
          path: vikela_models
          target: /opt/demanou/vikela_models
        - action: rebuild
          path: bin/
          target: /opt/demanou/bin
    # command: --reload --reload-dir /opt/demanou/vikela --workers 1
    entrypoint: python /opt/demanou/vikela
    labels:
      - "vikela.enable=true"
      - "traefik.http.routers.vikela.service=vikela"
      - "traefik.http.routers.vikela.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.vikela.entryPoints=web"
      - "traefik.http.middlewares.vikela.forwardAuth.address=http://server:6303/api/verify?rd=http://localhost:6380/auth"
      - "traefik.http.middlewares.vikela.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.vikela.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.services.vikela.loadbalancer.server.port=6303"

  traefik:
    image: traefik:v3.0
    depends_on:
      - server
    command:
      - "--api.insecure=true"
      - "--api.dashboard=false"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=true"
      - "--providers.docker.constraints=Label(`vikela.enable`,`true`)"
      - "--entrypoints.web.address=:80"
      - "--global.sendAnonymousUsage=false"
      - "--global.checkNewVersion=false"
    ports:
      - "6380:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  public:
    image: traefik/whoami
    labels:
      - "vikela.enable=true"
      - "traefik.http.routers.public-whoami.service=public-whoami"
      - "traefik.http.routers.public-whoami.rule=PathPrefix(`/public`)"
      - "traefik.http.routers.public-whoami.entryPoints=web"
      - "traefik.http.services.public-whoami.loadbalancer.server.port=80"

  protected:
    image: traefik/whoami
    labels:
      - "vikela.enable=true"
      - "traefik.http.routers.protected-whoami.service=protected-whoami"
      - "traefik.http.routers.protected-whoami.rule=PathPrefix(`/protected`)"
      - "traefik.http.routers.protected-whoami.entryPoints=web"
      - "traefik.http.routers.protected-whoami.middlewares=vikela@docker"
      - "traefik.http.services.protected-whoami.loadbalancer.server.port=80"
...
